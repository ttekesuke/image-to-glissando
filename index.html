<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Image → Glissando</title>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
<style>
body{font-family:sans-serif}.layout{display:flex;align-items:flex-start;gap:16px}.left-pane{width:340px;flex:0 0 340px}.right-pane{flex:1 1 auto;min-width:0}.preview-stack{position:relative;width:320px}.preview-stack canvas{display:block;width:100%}.preview-stack .overlay{position:absolute;inset:0;pointer-events:none}#binary-preview{display:block;width:320px}#score-viewport{position:relative;overflow:hidden}
</style>
</head>
<body>
<div id="app">
<h1>Image → Glissando</h1>
<div class="layout">
<div class="left-pane">
<p><input type="file" ref="fileInput" accept="image/*" @change="handleFileSelect"></p>
<div @dragover.prevent @drop.prevent="handleDrop">または画像をここにドロップ</div>
<template v-if="sourceImage">
<p><label>抽出方式: <select v-model="extractionMode" @change="scheduleExtractionPreview"><option value="edge">Edge</option><option value="silhouette">Silhouette</option></select></label></p>
<template v-if="extractionMode === 'edge'">
<p><label>Edge threshold: {{ edgeThreshold }} <input type="range" min="1" max="255" step="1" v-model="edgeThreshold" @input="scheduleExtractionPreview"></label></p>
<p><label>Blur: {{ blurRadius }} <input type="range" min="0" max="4" step="1" v-model="blurRadius" @input="scheduleExtractionPreview"></label></p>
<p><label>Min line length: {{ minTraceLength }} px <input type="range" min="2" max="120" step="1" v-model="minTraceLength" @input="scheduleExtractionPreview"></label></p>
<p><label>Simplify: {{ simplifyTolerance }} px <input type="range" min="0" max="8" step="0.5" v-model="simplifyTolerance" @input="scheduleExtractionPreview"></label></p>
</template>
<template v-else>
<p><label>Binary threshold: {{ threshold }} <input type="range" min="0" max="255" step="1" v-model="threshold" @input="scheduleExtractionPreview"></label> Otsu: {{ autoThreshold }}</p>
</template>
<p><button @click="renderScoreFromCurrentImage">楽譜化</button> <button @click="saveScoreAsPng" :disabled="!stats">PNG保存</button></p>
<p>元画像 + 抽出線</p>
<div class="preview-stack"><canvas ref="originalCanvas"></canvas><canvas ref="segmentCanvas" class="overlay"></canvas></div>
<p>{{ extractionMode === 'edge' ? 'Edge mask' : 'Binary mask' }}</p>
<canvas ref="edgeCanvas" id="binary-preview"></canvas>
</template>
</div>
<div class="right-pane">
<p v-if="stats">解析線分: {{ stats.segments }} / 楽譜線分: {{ stats.scoreSegments }} / 声部: {{ stats.voices }} / 音符イベント: {{ stats.noteEvents }} / 接続線: {{ stats.stavelines }} / 小節: {{ stats.measures }} / 五線: {{ stats.staves }} / 解析: {{ stats.analysisCols }}×{{ stats.analysisRows }}</p>
<div id="score-viewport" ref="scoreViewport"><div id="vexflow-container" ref="vexflowContainer"></div></div>
</div>
</div>
</div>
<script src="./extractor.js"></script>
<script src="./score-convert.js"></script>
<script src="./score-render.js"></script>
<script src="./app.js"></script>
</body>
</html>
